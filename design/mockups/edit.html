<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Reminder editor</title>
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script>
<style>
  .form { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 20px; }
  .lab { font-size: 15px; line-height: 22px; font-weight: 700; margin: 0 16px 8px; }
  .dayrow { background: var(--sc); padding: 8px 12px 12px; }
  .dayrow .sum { font-size: 13px; line-height: 20px; color: var(--on-surface-variant); padding: 6px 4px 0; }
</style></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <!-- TopAppBar: close (= discard, asks only if something changed) + title. Edit mode adds ⋮ (حذف). No Save up here. -->
  <div class="topbar">
    <span class="iconbtn on-surface"><i data-i="close"></i></span>
    <div class="title t-title-l">تذكير جديد</div>
  </div>
  <div class="grow" style="overflow:hidden">
    <div class="form">
      <div class="field focus"><span class="lbl">العنوان</span>موعد طبيب الأسنان<span class="caret"></span></div>
      <div class="field" style="min-height:80px"><span class="ph">ملاحظة</span></div>
    </div>
    <div class="group-h">الموعد</div>
    <div class="group">
      <div class="row"><i data-i="alarm"></i><div class="txt"><div class="h reg">ذكّرني في وقت محدد</div></div><span class="switch on"></span></div>
      <div class="row"><i data-i="event"></i><div class="txt"><div class="ov">التاريخ</div><div class="h reg">السبت 14 نوفمبر 2026</div></div></div>
      <div class="row"><i data-i="clock"></i><div class="txt"><div class="ov">الوقت</div><div class="h reg num">10:00 م</div></div></div>
      <div class="row"><i data-i="repeat"></i><div class="txt"><div class="ov">التكرار</div><div class="h reg">أيام محددة من الأسبوع</div></div></div>
      <div class="dayrow">
        <div class="days"><span class="day">س</span><span class="day on">ح</span><span class="day">ن</span><span class="day on">ث</span><span class="day">ر</span><span class="day on">خ</span><span class="day">ج</span></div>
        <div class="sum">كل الأحد، الثلاثاء، الخميس</div>
      </div>
      <div class="row"><i data-i="bell"></i><div class="txt"><div class="ov">تنبيه مبكر</div><div class="h reg">قبل 15 دقيقة</div></div></div>
    </div>
    <div class="group-h">التفاصيل</div>
    <div class="lab">الأهمية</div>
    <div style="margin:0 16px 16px" class="seg"><div class="sel"><i data-i="check"></i>عادي</div><div><i data-i="flag"></i>متوسط</div><div><i data-i="flagfill"></i>مهم</div></div>
    <div class="lab">التصنيف</div>
    <div style="margin:0 16px" class="seg"><div class="sel"><i data-i="check"></i>شخصي</div><div>عمل</div><div>دراسة</div></div>
  </div>
  <!-- The single primary: «حفظ», full width, bottom, stays above the keyboard (imePadding) -->
  <div class="bottombar"><span class="btn filled lg block"><i data-i="check"></i>حفظ</span></div>
  <div class="gesturebar" style="background:var(--sc)"></div>
</div></body></html>
