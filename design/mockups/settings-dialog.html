<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Theme dialog</title>
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <div class="topbar">
    <span class="iconbtn on-surface"><i data-i="back"></i></span>
    <div class="title t-title-l">الإعدادات</div>
  </div>
  <div class="grow" style="overflow:hidden">
    <div class="group" style="margin-top:4px">
      <div class="row"><i data-i="okfill" class="pri"></i><div class="txt"><div class="h">السماح بالعمل في الخلفية</div><div class="s">كل الأذونات الضرورية جاهزة</div></div><i data-i="chevron" class="s20"></i></div>
    </div>
    <div class="group-h">العرض</div>
    <div class="group">
      <div class="row"><i data-i="globe"></i><div class="txt"><div class="h">اللغة</div><div class="s">العربية</div></div></div>
      <div class="row"><i data-i="contrast"></i><div class="txt"><div class="h">السمة</div><div class="s">حسب الهاتف</div></div></div>
      <div class="row"><i data-i="month"></i><div class="txt"><div class="h">أسماء الأشهر</div><div class="s">تشرين الثاني</div></div></div>
      <div class="row"><i data-i="calendar"></i><div class="txt"><div class="h">أول يوم في الأسبوع</div><div class="s">السبت</div></div></div>
    </div>
    <div class="group-h">التنبيه</div>
    <div class="group">
      <div class="row"><i data-i="volume"></i><div class="txt"><div class="h">صوت التذكير</div><div class="s">يُسمع صوت الإشعار حين يحين الوقت.</div></div><span class="switch on"></span></div>
    </div>
  </div>
  <div class="gesturebar"></div>
  <!-- Radio choices live in a dialog: a tap applies at once and closes; «إلغاء» closes without change -->
  <div class="scrim"></div>
  <div class="dialog" style="top:290px">
    <div class="dt">السمة</div>
    <div class="opt"><span class="radio on"></span>حسب الهاتف</div>
    <div class="opt"><span class="radio"></span>فاتح</div>
    <div class="opt"><span class="radio"></span>داكن</div>
    <div class="acts"><span class="btn text">إلغاء</span></div>
  </div>
</div></body></html>
