<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Subtasks (steps)</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .form { padding: 12px 16px 0; }
  .sh { display: flex; align-items: baseline; gap: 8px; padding: 20px 32px 8px; }
  .sh .t { flex: 1; font-size: 15px; line-height: 22px; font-weight: 700; color: var(--primary); }
  .sh .n { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--on-surface-variant); }
  .prog { margin: 0 32px 12px; }
  .ck { background: var(--sc); display: flex; align-items: center; min-height: 56px; padding: 0 4px; }
  .ck .tx { flex: 1; min-width: 0; font-size: 16px; line-height: 26px; padding: 8px 0; }
  .ck.done .tx { color: var(--on-surface-variant); text-decoration: line-through; }
  .ck .dr { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); }
  .ck .dr i { width: 20px; height: 20px; }
  .ck.add .tx { color: var(--on-surface-variant); }
  .ck.add .ai { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--primary); }
  .group { --icon-cut: var(--sc); }
</style></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <div class="topbar">
    <span class="iconbtn on-surface"><i data-i="close"></i></span>
    <div class="title t-title-l">تعديل التذكير</div>
    <span class="iconbtn"><i data-i="more"></i></span>
  </div>
  <div class="grow" style="overflow:hidden">
    <div class="form"><div class="field"><span class="lbl">العنوان</span>تجهيز السفر</div></div>
    <!-- «الخطوات» (Windows field `checklist`): progress as text + bar; each step is its own checkbox node. -->
    <div class="sh"><span class="t">الخطوات</span><span class="n num">2 من 5</span></div>
    <div class="lin prog"><b style="width:40%"></b></div>
    <div class="group">
      <div class="ck done"><span class="cbx on"><span><i data-i="check"></i></span></span><span class="tx">جواز السفر</span><span class="dr"><i data-i="drag"></i></span></div>
      <div class="ck done"><span class="cbx on"><span><i data-i="check"></i></span></span><span class="tx">تذكرة الطيران</span><span class="dr"><i data-i="drag"></i></span></div>
      <div class="ck"><span class="cbx"></span><span class="tx">حجز الفندق</span><span class="dr"><i data-i="drag"></i></span></div>
      <div class="ck"><span class="cbx"></span><span class="tx">شاحن الهاتف</span><span class="dr"><i data-i="drag"></i></span></div>
      <div class="ck"><span class="cbx"></span><span class="tx">الأدوية</span><span class="dr"><i data-i="drag"></i></span></div>
      <div class="ck add"><span class="ai"><i data-i="add"></i></span><span class="tx">أضف خطوة</span></div>
    </div>
    <div class="group" style="margin-top:12px">
      <div class="row"><i data-i="tasks"></i><div class="txt"><div class="h reg">أنجز التذكير عند إكمال كل الخطوات</div></div><span class="switch on"></span></div>
    </div>
    <div class="sh"><span class="t">الملاحظة</span></div>
    <div class="form" style="padding-top:0"><div class="field" style="min-height:80px"><span class="ph">ملاحظة</span></div></div>
  </div>
  <div class="bottombar"><span class="btn filled lg block"><i data-i="check"></i>حفظ</span></div>
  <div class="gesturebar" style="background:var(--sc)"></div>
</div></body></html>
