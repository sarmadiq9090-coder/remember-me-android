<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Change history</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .topbar .title { line-height: 26px; }
  .sub { display: block; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--on-surface-variant); }
  .dh { font-size: 15px; line-height: 22px; font-weight: 700; padding: 16px 32px 8px; }
  .ev { display: flex; gap: 16px; align-items: center; padding: 8px 24px; min-height: 64px; position: relative; }
  .ev .disc { width: 40px; height: 40px; background: var(--secondary-container); color: var(--on-secondary-container); }
  .ev .disc i { width: 20px; height: 20px; }
  .ev .tx { flex: 1; min-width: 0; font-size: 16px; line-height: 26px; }
  .ev .tm { font-size: 13px; line-height: 20px; color: var(--on-surface-variant); }
  /* timeline line between discs */
  .ev:not(:last-child)::after { content: ""; position: absolute; top: 52px; bottom: -12px; inset-inline-start: 43px; width: 2px; background: var(--outline-variant); }
  .foot { padding: 16px 24px; font-size: 13px; line-height: 20px; color: var(--on-surface-variant); display: flex; gap: 8px; }
  .foot i { width: 18px; height: 18px; flex: none; margin-top: 1px; }
</style></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <div class="topbar"><span class="iconbtn on-surface"><i data-i="back"></i></span>
    <div class="title t-title-l">السجل<span class="sub">دفع الإيجار</span></div></div>
  <div class="grow" style="overflow:hidden">
    <div class="dh">اليوم</div>
    <div>
      <div class="ev"><span class="disc"><i data-i="snooze"></i></span><div class="tx">أُجّل 10 دقائق<div class="tm num">9:05 ص</div></div></div>
    </div>
    <div class="dh num">12 نوفمبر</div>
    <div>
      <div class="ev"><span class="disc"><i data-i="event"></i></span><div class="tx num">غُيّر الموعد: من 5:00 م إلى 9:00 ص<div class="tm num">7:40 م</div></div></div>
      <div class="ev"><span class="disc"><i data-i="repeat"></i></span><div class="tx">تغيّر التكرار: كل شهر<div class="tm num">7:40 م</div></div></div>
      <div class="ev"><span class="disc"><i data-i="bell"></i></span><div class="tx">أُضيف تنبيه: قبل يومين<div class="tm num">7:41 م</div></div></div>
    </div>
    <div class="dh num">10 نوفمبر</div>
    <div>
      <div class="ev"><span class="disc"><i data-i="add"></i></span><div class="tx">أُنشئ<div class="tm num">8:14 م</div></div></div>
    </div>
    <div class="foot"><i data-i="lock"></i><span>السجل محفوظ على هاتفك فقط. يمكنك إيقافه أو مسحه من الإعدادات.</span></div>
  </div>
  <div class="gesturebar"></div>
</div></body></html>
