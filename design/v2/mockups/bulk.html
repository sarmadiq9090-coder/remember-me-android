<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Bulk selection</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .ctx { background: var(--sc-high); }
  .statusbar.ctx2 { background: var(--sc-high); }
</style></head>
<body><div class="phone">
  <div class="statusbar ctx2"></div>
  <!-- Contextual top bar (selection mode, entered by long-press on a row): close (cd «إلغاء التحديد»), count,
       select all (cd «تحديد الكل»), ⋮ menu: «تصدير المحدد»، «أرشفة». Chips row and FAB are hidden. -->
  <div class="topbar ctx">
    <span class="iconbtn on-surface"><i data-i="close"></i></span>
    <div class="title t-title-l num">3 محددة</div>
    <span class="iconbtn"><i data-i="selectall"></i></span>
    <span class="iconbtn"><i data-i="more"></i></span>
  </div>
  <div class="grow" style="overflow:hidden">
    <div class="sec" style="padding-top:12px"><i data-i="warning" class="s20 err"></i><span class="t err">المتأخرة</span><span class="n num">1</span></div>
    <div class="group">
      <div class="rem late selected"><span class="selmark on"><span><i data-i="check"></i></span></span>
        <div class="body"><div class="tl"><span class="time">2:00 <span class="ap">م</span></span><span class="when lateinfo">متأخر ساعتين</span></div>
          <div class="ttl">دواء الضغط</div>
          <div class="meta"><span class="it"><i data-i="repeat"></i>كل يوم</span><span class="tag"><i data-i="flagfill"></i>مهم</span></div></div></div>
    </div>

    <div class="sec"><span class="t">اليوم</span><span class="n num">3</span></div>
    <div class="group">
      <div class="rem selected"><span class="selmark on"><span><i data-i="check"></i></span></span>
        <div class="body"><div class="tl"><span class="time">5:30 <span class="ap">م</span></span></div>
          <div class="ttl">اجتماع الفريق</div>
          <div class="meta"><span class="it"><i data-i="label"></i>عمل</span><span class="it num"><i data-i="tasks"></i>2 من 5</span></div></div></div>
      <div class="rem"><span class="selmark"><span></span></span>
        <div class="body"><div class="tl"><span class="time">7:00 <span class="ap">م</span></span><span class="tag snz"><i data-i="snooze"></i>مؤجّل</span></div>
          <div class="ttl">شراء الخبز والحليب</div>
          <div class="meta"><span class="it"><i data-i="label"></i>المنزل</span></div></div></div>
      <div class="rem selected"><span class="selmark on"><span><i data-i="check"></i></span></span>
        <div class="body"><div class="tl"><span class="time">9:00 <span class="ap">م</span></span></div>
          <div class="ttl">مراجعة درس الرياضيات</div>
          <div class="meta"><span class="it"><i data-i="repeat"></i>كل الأحد، الثلاثاء، الخميس</span><span class="tag outline"><i data-i="flag"></i>متوسط</span></div></div></div>
    </div>

    <div class="sec"><span class="t">القادمة</span><span class="n num">4</span></div>
    <div class="group">
      <div class="rem"><span class="selmark"><span></span></span>
        <div class="body"><div class="tl"><span class="time">9:00 <span class="ap">ص</span></span><span class="when">غدًا</span></div>
          <div class="ttl">دفع الإيجار</div>
          <div class="meta"><span class="it"><i data-i="repeat"></i>كل شهر</span></div></div></div>
    </div>
  </div>
  <!-- Bottom action bar replaces the NavigationBar: 5 labelled actions, primary «تم» last (end = left in RTL).
       Fewer than 10 selected: applies at once + Undo snackbar. 10 or more: asks first (bulk-confirm). -->
  <div class="actbar">
    <div class="a"><span class="ic"><i data-i="trash"></i></span>حذف</div>
    <div class="a"><span class="ic"><i data-i="flag"></i></span>الأهمية</div>
    <div class="a"><span class="ic"><i data-i="move"></i></span>نقل</div>
    <div class="a"><span class="ic"><i data-i="snooze"></i></span>أجّل</div>
    <div class="a p"><span class="ic"><i data-i="check"></i></span>تم</div>
  </div>
  <div class="gesturebar nav"></div>
</div></body></html>
