<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Home-screen widgets</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .phone { background: linear-gradient(160deg, #9FB8AA 0%, #5E7D6E 55%, #36513F 100%); }
  @media (prefers-color-scheme: dark) { .phone { background: linear-gradient(160deg, #24342C 0%, #18241E 60%, #0E1612 100%); } }
  .statusbar { color: #fff; }
  .w { margin: 8px 16px 0; background: var(--surface); color: var(--on-surface); border-radius: 24px; padding: 8px 8px 12px 8px; box-shadow: var(--shadow-1); }
  .wh { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; }
  .wh .brand { margin-inline-start: 8px; width: 28px; height: 28px; }
  .wh .t { flex: 1; font-size: 16px; line-height: 24px; font-weight: 700; }
  .wadd { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
  .wr { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 12px 4px 4px; background: var(--sc); border-radius: 4px; margin-top: 2px; --icon-cut: var(--sc); }
  html[dir=rtl] .wr { padding: 4px 4px 4px 12px; }
  .wr.first { border-top-left-radius: 16px; border-top-right-radius: 16px; }
  .wr.last { border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
  .wr .done-btn { margin-top: 0; }
  .wr .tm { width: 76px; flex: none; font-size: 15px; line-height: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wr .tm .d { display: block; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--on-surface-variant); }
  .wr .ti { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wr.late .tm, .wr.late .d { color: var(--error); }
  .wr.donestate .ti { color: var(--on-surface-variant); }
  .wr .chk { width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--primary); }
  .wr .chk i { width: 26px; height: 26px; }
  .wr .btn.text { padding: 0 12px; }
  .small { width: 196px; margin: 8px 16px 0; background: var(--surface); color: var(--on-surface); border-radius: 24px; padding: 12px 16px; box-shadow: var(--shadow-1); }
  .small .lb { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--on-surface-variant); }
  .small .big { font-size: 28px; line-height: 36px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .small .big .ap { font-size: 16px; }
  .small .ti { font-size: 15px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small .btn { margin-top: 8px; min-height: 48px; width: 100%; }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 0; padding: 20px 16px; justify-items: center; }
  .icons span { width: 56px; height: 56px; border-radius: 18px; background: rgba(255,255,255,.35); }
  .cap { margin: 16px 24px 0; font-size: 13px; line-height: 20px; color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
</style></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <div class="cap"><span class="ltr">4×3</span>: القائمة مع «تم»</div>
  <!-- RemoteViews list widget: header (mark, name, add 48 dp cd «تذكير جديد»); rows: Done circle at the START
       (48 dp, cd «تم: <title>»), 76 dp time column with a word label, title on one line. -->
  <div class="w">
    <div class="wh"><span class="brand" data-brand></span><span class="t">ذكرني</span><span class="wadd"><i data-i="add"></i></span></div>
    <div class="wr late first"><span class="done-btn"></span><span class="tm">2:00 م<span class="d">متأخر</span></span><span class="ti">دواء الضغط</span><i data-i="warning" class="s20 err"></i></div>
    <div class="wr"><span class="done-btn"></span><span class="tm">5:30 م<span class="d">اليوم</span></span><span class="ti">اجتماع الفريق</span></div>
    <!-- After tapping the circle: the row shows «أُنجز» + «تراجع» for 10 seconds (F-121), then leaves the list -->
    <div class="wr donestate"><span class="chk"><i data-i="done"></i></span><span class="ti">أُنجز: شراء الخبز والحليب</span><span class="btn text">تراجع</span></div>
    <div class="wr last"><span class="done-btn"></span><span class="tm">9:00 ص<span class="d">غدًا</span></span><span class="ti">دفع الإيجار</span></div>
  </div>
  <div class="cap"><span class="ltr">2×1</span>: التالي</div>
  <div class="small">
    <div class="lb">التالي</div>
    <div class="big">5:30 <span class="ap">م</span></div>
    <div class="ti">اجتماع الفريق</div>
    <span class="btn tonal"><i data-i="check"></i>تم</span>
  </div>
  <div class="icons"><span></span><span></span><span></span><span></span></div>
  <div class="grow"></div>
  <div class="gesturebar"></div>
</div></body></html>
