<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Quick Settings tile</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  /* Quick Settings is system UI (neutral). The app supplies only the tile: icon, label «تذكير جديد», subtitle «ذكرني».
     TileService: STATE_INACTIVE styling by default; shown here in its active-looking style as the system draws app tiles. */
  .phone { --shade: #E9ECEF; --tile: #D6DADF; --tile-on: #246A4B; --tile-on-ink: #FFFFFF; --card: #FFFFFF; --sys-ink: #1F1F1F; --sys-muted: #4A4A4A; background: var(--shade); color: var(--sys-ink); }
  @media (prefers-color-scheme: dark) { .phone { --shade: #121314; --tile: #303236; --tile-on: #8FD5AF; --tile-on-ink: #003823; --card: #2A2B2D; --sys-ink: #ECECEC; --sys-muted: #C4C4C4; } }
  .phone { --icon-cut: var(--card); }
  .qh { display: flex; align-items: center; justify-content: space-between; padding: 8px 24px 12px; }
  .bright { margin: 0 16px 16px; height: 48px; border-radius: 24px; background: var(--tile); position: relative; overflow: hidden; }
  .bright b { position: absolute; top: 0; bottom: 0; right: 0; width: 62%; background: var(--sys-muted); opacity: .55; border-radius: 24px; }
  .bright i { position: absolute; right: 14px; top: 12px; color: var(--card); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
  .t { min-height: 64px; border-radius: 32px; background: var(--tile); display: flex; align-items: center; gap: 12px; padding: 0 16px; }
  .t .ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; background: rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { .t .ic { background: rgba(255,255,255,.08); } }
  .t .l { font-size: 14px; line-height: 20px; font-weight: 600; }
  .t .s { font-size: 12px; line-height: 16px; color: var(--sys-muted); }
  .t.app { grid-column: span 2; background: var(--tile-on); color: var(--tile-on-ink); }
  .t.app .s { color: var(--tile-on-ink); opacity: .85; }
  .t.app .ic { background: rgba(255,255,255,.18); }
  @media (prefers-color-scheme: dark) { .t.app .ic { background: rgba(0,0,0,.12); } }
  .cap { margin: 12px 24px 8px; font-size: 13px; line-height: 20px; color: var(--sys-muted); font-weight: 600; }
  .ncard { margin: 8px 12px 0; background: var(--card); border-radius: 24px; padding: 14px 16px; }
  .nhead { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sys-muted); }
  .nicon { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; }
  .nicon i { width: 18px; height: 18px; }
  .nt { font-size: 16px; line-height: 24px; font-weight: 600; margin: 6px 36px 0 0; }
  .nb { font-size: 14px; line-height: 22px; color: var(--sys-muted); margin: 0 36px 0 0; }
</style>
<script>
  // Neutral stand-ins for system tile glyphs (not app icons)
  const _S = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></svg>';
  KIT.icons.bt = _S('M7 7.5l10 9-5 4.5V3l5 4.5-10 9');
  KIT.icons.flash = _S('M9 3h6l-1.5 6h3L9.5 21l1.5-8.5H8z');
  KIT.icons.plane = _S('M12 3c.8 0 1.3.8 1.3 1.8V10l7.2 4.2v2l-7.2-2.2v4.3l2 1.5v1.7L12 20.5l-3.3 1v-1.7l2-1.5V14l-7.2 2.2v-2L10.7 10V4.8C10.7 3.8 11.2 3 12 3z');
</script></head>
<body><div class="phone">
  <div class="statusbar" style="color:var(--sys-ink)"></div>
  <div class="qh"><span class="t-title-l num">4:20</span><span class="t-body-m" style="color:var(--sys-muted)">السبت 14 نوفمبر</span></div>
  <div class="bright"><b></b><i data-i="sun"></i></div>
  <div class="grid">
    <div class="t"><span class="ic"><i data-i="wifi"></i></span><div><div class="l">واي فاي</div><div class="s">متصل</div></div></div>
    <div class="t"><span class="ic"><i data-i="bt"></i></span><div><div class="l">بلوتوث</div><div class="s">مطفأ</div></div></div>
    <div class="t"><span class="ic"><i data-i="dnd"></i></span><div><div class="l">عدم الإزعاج</div><div class="s">مطفأ</div></div></div>
    <div class="t"><span class="ic"><i data-i="flash"></i></span><div><div class="l">المصباح</div><div class="s">مطفأ</div></div></div>
    <!-- Our tile (TileService, label «تذكير جديد», subtitle «ذكرني», cd «تذكير جديد، ذكرني») -->
    <div class="t app"><span class="ic"><i data-i="bellfill"></i></span><div><div class="l">تذكير جديد</div><div class="s">ذكرني</div></div></div>
    <div class="t"><span class="ic"><i data-i="plane"></i></span><div><div class="l">الطيران</div><div class="s">مطفأ</div></div></div>
    <div class="t"><span class="ic"><i data-i="batt"></i></span><div><div class="l">توفير الطاقة</div><div class="s">مطفأ</div></div></div>
  </div>
  <div class="cap">اللمس يفتح الإضافة السريعة؛ على شاشة القفل يطلب فتح القفل أولًا.</div>
  <div class="ncard">
    <div class="nhead"><span class="nicon"><i data-i="bellfill"></i></span><span>ذكرني</span><span>•</span><span>الآن</span><i data-i="pin" class="s18"></i></div>
    <div class="nt">دواء الضغط</div>
    <div class="nb num">حان الوقت، 2:00 م، كل يوم</div>
  </div>
  <div class="grow"></div>
  <div class="gesturebar"></div>
</div></body></html>
