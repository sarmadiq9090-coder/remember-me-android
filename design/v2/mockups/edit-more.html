<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Editor 1.0.0 (scrolled, advanced collapsed)</title>
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .lab { font-size: 15px; line-height: 22px; font-weight: 700; color: var(--primary); padding: 20px 32px 8px; }
  .row.add { color: var(--primary); font-weight: 500; min-height: 56px; }
  .row.add > i[data-i] { color: var(--primary); }
  .adv { margin: 24px 16px 16px; border-radius: 20px; background: var(--sc); display: flex; align-items: center; gap: 16px; padding: 12px 16px; min-height: 72px; }
  .adv > i[data-i] { color: var(--on-surface-variant); }
  .adv .txt { flex: 1; min-width: 0; }
  .adv .h { font-size: 16px; line-height: 26px; font-weight: 500; }
  .adv .s { font-size: 13px; line-height: 20px; color: var(--on-surface-variant); }
</style></head>
<body><div class="phone">
  <div class="statusbar"></div>
  <!-- Edit mode: ⋮ holds «السجل»، «نسخ»، «حذف» (حذف = trash + Undo snackbar on Home). The top bar stays put while the form scrolls. -->
  <div class="topbar">
    <span class="iconbtn on-surface"><i data-i="close"></i></span>
    <div class="title t-title-l">تعديل التذكير</div>
    <span class="iconbtn"><i data-i="more"></i></span>
  </div>
  <div class="grow" style="overflow:hidden">
    <div class="group" style="margin-top:4px">
      <div class="row"><i data-i="label"></i><div class="txt"><div class="ov">التصنيف</div><div class="h reg">شخصي</div></div></div>
      <div class="row"><i data-i="tag"></i><div class="txt"><div class="ov">الوسوم</div><div class="h reg">صحة</div></div></div>
    </div>
    <div class="lab">الأهمية</div>
    <div style="margin:0 16px" class="seg"><div><i data-i="check"></i>عادي</div><div><i data-i="flag"></i>متوسط</div><div class="sel"><i data-i="flagfill"></i>مهم</div></div>
    <div class="lab">الملاحظة والخطوات</div>
    <div style="padding:0 16px 12px"><div class="field" style="min-height:84px"><span class="lbl">ملاحظة</span>أحضر صورة الأشعة السابقة.</div></div>
    <div class="group">
      <div class="row"><i data-i="tasks"></i><div class="txt"><div class="ov">الخطوات</div><div class="h reg num">0 من 2</div></div></div>
      <div class="row add"><i data-i="add"></i><div class="txt">أضف خطوة</div></div>
    </div>
    <!-- 8. Advanced options: collapsed by default; the summary says what is set, so nothing hides silently -->
    <div class="adv"><i data-i="settings"></i>
      <div class="txt"><div class="h">خيارات التنبيه</div><div class="s">تذكير عادي، النغمة الافتراضية، الشاشة الكاملة حسب الإعداد</div></div>
      <i data-i="expand"></i></div>
  </div>
  <div class="bottombar"><span class="btn filled lg block"><i data-i="check"></i>حفظ</span></div>
  <div class="gesturebar" style="background:var(--sc)"></div>
</div></body></html>
