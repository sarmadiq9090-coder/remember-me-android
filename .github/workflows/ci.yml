# Build an UNSIGNED release APK, run every unit test and lint on each push and pull request.
# No secrets, no signing: release APKs are signed locally by the maintainer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Dependencies are checked against gradle/verification-metadata.xml (SHA-256) in every step.
      # Two flavors: `full` (GitHub build with the self-updater) and `fdroid` (no self-updater, no network permission).
      - name: Unit tests (JVM, Robolectric, Compose UI), both flavors
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest

      - name: Build unsigned release APKs and run lint, both flavors
        run: ./gradlew --no-daemon :app:assembleFullRelease :app:assembleFdroidRelease :app:lintFullRelease :app:lintFdroidRelease

      - name: Check permissions (allowed list per flavor)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
          # The reminder permissions (README, docs/PRIVACY.md). The `full` flavor also has, since 1.0.5, INTERNET,
          # ACCESS_NETWORK_STATE and REQUEST_INSTALL_PACKAGES for the GitHub-only update check (D-081); `fdroid` has none of them.
          # The app-internal signature permission added by androidx.core is not a system permission.
          base='POST_NOTIFICATIONS USE_EXACT_ALARM SCHEDULE_EXACT_ALARM USE_FULL_SCREEN_INTENT RECEIVE_BOOT_COMPLETED VIBRATE REQUEST_IGNORE_BATTERY_OPTIMIZATIONS FOREGROUND_SERVICE'
          for flavor in full fdroid; do
            APK=$(ls app/build/outputs/apk/$flavor/release/*.apk | head -n 1)
            "$AAPT2" dump permissions "$APK" | tee permissions-$flavor.txt
            allowed="$base"
            if [ "$flavor" = full ]; then allowed="$base INTERNET ACCESS_NETWORK_STATE REQUEST_INSTALL_PACKAGES"; fi
            others=$(grep '^uses-permission:' permissions-$flavor.txt | while read -r line; do
              name=$(echo "$line" | sed -n "s/.*name='\([^']*\)'.*/\1/p")
              case "$name" in
                com.fastkiwi.rememberme.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) continue ;;
                android.permission.*) short=${name#android.permission.}; case " $allowed " in *" $short "*) continue ;; esac ;;
              esac
              echo "$name"
            done)
            if [ -n "$others" ]; then echo "Unexpected permissions in the $flavor flavor:"; echo "$others"; exit 1; fi
          done
          # The full flavor must still have its update permissions (the in-app updater needs them).
          for p in INTERNET ACCESS_NETWORK_STATE REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$p" permissions-full.txt || { echo "full flavor lost $p"; exit 1; }
          done
          # Network code is allowed only in the update client (a directory named update/).
          hits=$(grep -rln 'openConnection\|HttpURLConnection\|HttpsURLConnection\|java.net.Socket\|okhttp' app/src/main/java | grep -v '/update/' || true)
          if [ -n "$hits" ]; then echo "Network code outside update/:"; echo "$hits"; exit 1; fi

      - name: Upload unsigned APKs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-and-reports
          path: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/reports/
          retention-days: 14

  reuse:
    name: reuse-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
