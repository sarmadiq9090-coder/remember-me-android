name: "مشكلة / Problem"
description: "أبلغ عن خطأ في ذكرني لأندرويد — Report a bug in Remember Me for Android"
title: "[Remember Me Android] مشكلة: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **لا تكتب عناوين تذكيراتك أو بياناتك الشخصية هنا؛ هذه الصفحة عامة.**
        **Do not post your reminder titles or personal data here; this page is public.**
  - type: textarea
    id: description
    attributes:
      label: "ماذا حدث؟ وما الذي توقعته؟ — What happened, and what did you expect?"
      description: "خطوات إعادة المشكلة إن أمكن. إن تأخر تنبيه فأرفق «تقرير التوافق» من التطبيق (لا يحوي بيانات شخصية) — Steps to reproduce, if you can. For a late alert, attach the in-app compatibility report (it contains no personal data)."
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: "معلومات الجهاز (اختياري) — Device information (optional)"
      description: "إصدار التطبيق، أندرويد، طراز الهاتف، اللغة — App version, Android, phone model, language."
      render: text
    validations:
      required: false
