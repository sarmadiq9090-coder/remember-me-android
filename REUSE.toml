version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 FastKiwi"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["gradle/wrapper/**", "gradlew", "gradlew.bat"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["app/src/main/res/font/noto_sans_arabic_*.ttf", "design/mockups/fonts/NotoSansArabic-VF.ttf", "design/v2/kit/fonts/NotoSansArabic-VF.ttf", "design/mockups/fonts/OFL-NotoSansArabic.txt", "design/v2/kit/fonts/OFL-NotoSansArabic.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/arabic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["design/mockups/fonts/NotoSans-*.ttf", "design/v2/kit/fonts/NotoSans-*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Noto Project Authors (https://github.com/notofonts/latin-greek-cyrillic)"
SPDX-License-Identifier = "OFL-1.1"

# Material Symbols Rounded, vendored by tools/vendor_symbols.py (THIRD_PARTY.md)
[[annotations]]
path = "app/src/main/res/drawable/ms_*.xml"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC (Material Symbols)"
SPDX-License-Identifier = "Apache-2.0"

# Material Icons paths (add, check, snooze, warning)
[[annotations]]
path = ["app/src/main/res/drawable/ic_add.xml", "app/src/main/res/drawable/ic_check.xml", "app/src/main/res/drawable/ic_snooze.xml", "app/src/main/res/drawable/ic_warning.xml"]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC (Material Icons)"
SPDX-License-Identifier = "Apache-2.0"
